# Unsigned macOS 13+ development build for BookSkill Desktop (PKG-001).
#
# This is NOT a signed or notarized official release.
# Remote success of this job is a development sample only.
# It is not G1, and it is not a production publish.
# Official signed installers remain blocked until signing certificates
# and notarization credentials are available (B-003 / P-005) and a human
# approves publish.
name: Unsigned macOS 13+ development build

on:
  workflow_dispatch:
  pull_request:
    branches: [integration]
  push:
    branches: [feat/PKG-001, integration]

jobs:
  macos-dev-build:
    name: Unsigned macOS 13+ development sample
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # Unsigned sample: do not fail looking for a signing certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack unsigned macOS .dmg and .zip
        run: pnpm --filter @bookskill/desktop pack:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List packaging output
        run: ls -la packages/desktop/out

      - name: Upload unsigned macOS development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BookSkill-Desktop-macOS-dev-unsigned
          path: |
            packages/desktop/out/*.dmg
            packages/desktop/out/*.zip
          if-no-files-found: error
          compression-level: 0
