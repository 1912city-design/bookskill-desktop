name: CI

on:
  push:
    branches: [main, integration, "feat/**"]
  pull_request:
  workflow_dispatch:

# A failing lint, Test, or build step fails this job.
# Remote GitHub Actions is not connected for this workspace yet.
# This file is the intended workflow; it has not been observed green on GitHub.

jobs:
  lint-test-build:
    name: lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
